spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_FORMAT_SQL:true}

  docker:
    compose:
      enabled: false

app:
  jwt:
    applicationSignature: ${APP_JWT_APPLICATION_SIGNATURE:secret}
    accessTokenExpiration: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_TIME:3600}
    refreshTokenExpiration: ${APP_JWT_REFRESH_TOKEN_EXPIRATION_TIME:86400}
    audience: ${APP_JWT_AUDIENCE:audience}
    issuer: ${APP_JWT_ISSUER:issuer}

  cookie:
    sameSite: ${APP_COOKIE_SAME_SITE:lax}
    httpOnly: true
    secure: ${APP_COOKIE_SECURE:true}
    refreshCookiePath: ${APP_COOKIE_REFRESH_COOKIE_PATH:/api/v1/auth}
    accessCookiePath: ${APP_COOKIE_ACCESS_COOKIE_PATH:/}

logging:
  level:
    org.hibernate.SQL: DEBUG
    root: DEBUG